name: QA Lab CI

on:
  push:
    branches: [main, motion]
  pull_request:
    branches: [main, motion]

jobs:
  test:
    name: Build, Playwright, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: npm run build

      - name: Start Next.js server
        run: npm run start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run Playwright tests (JSON reporter)
        id: playwright
        continue-on-error: true
        run: npx playwright test

      - name: Run Lighthouse CI
        if: always()
        run: npx lhci collect && npx lhci upload

      - name: Write engineering metrics
        if: always()
        run: node scripts/write-engineering-metrics.mjs

      - name: Commit engineering metrics
        if: always() && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update engineering metrics [skip ci]"
          file_pattern: content/engineering-metrics.json
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Upload test results
        if: always() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7

      - name: Fail job if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
